# JY (Jane Yi / EPFL LNMC) cohort — VPL + Red Nucleus + OBI Thalamus.
# Generated by hand to keep paths absolute to the user's workspace.

project_name: jy
output_dir: /Users/cristina.gonzalez/Documents/Pilot-Tests/datasets/Henrys/nwb-trace-qc/qc_output_jy

nwb_sources:
  - dataset: vpl
    path: /Users/cristina.gonzalez/Documents/Pilot-Tests/datasets/Henrys/JY/VPL
    recursive: true
    glob: "*.nwb"
  - dataset: rn
    path: /Users/cristina.gonzalez/Documents/Pilot-Tests/datasets/Henrys/JY/RN
    recursive: true
    glob: "*.nwb"
  - dataset: obi
    path: /Users/cristina.gonzalez/Documents/Pilot-Tests/datasets/Henrys/JY/OBI
    recursive: true
    glob: "**/*.nwb"

acquisition_tables:
  - path: /Users/cristina.gonzalez/Documents/Pilot-Tests/datasets/Henrys/JY/output_20260601_195219/jy_vpl_intracellular_electrophysiology_jane_yi_epfl_lnmc/data/parquet/acquisitions.parquet
    nwb_key_column: nwb_file
    nwb_key_format: basename
    columns: {stimulus_type: protocol, rate_hz: rate_hz, n_samples: n_samples, clamp_mode: clamp_mode, sweep_number: sweep_number}
  - path: /Users/cristina.gonzalez/Documents/Pilot-Tests/datasets/Henrys/JY/output_20260601_202803/jy_red_nucleus_intracellular_ephys_epfl_lnmc/data/parquet/nwb_acquisitions.parquet
    nwb_key_column: nwb_file
    nwb_key_format: basename
    columns: {stimulus_type: stimulus_description, rate_hz: sampling_rate, n_samples: n_samples, clamp_mode: clamp_type}
  - path: /Users/cristina.gonzalez/Documents/Pilot-Tests/datasets/Henrys/JY/output_20260601_205534/jy_thalamus_cell_morphology_and_electrophysiology_open_brain_institute_jane_yi/data/parquet/nwb_acquisition_series.parquet
    nwb_key_column: nwb_file
    nwb_key_format: basename
    columns: {stimulus_type: stimulus_type, rate_hz: rate_hz, n_samples: n_samples, sweep_number: sweep_number}

stimulus_protocols:
  spontaneous_hold: [SponHold3, SponHold30, SponNoHold30, StartHold]
  test_pulse:       [Rac, TestAmpl, TestRheo, ResetITC, ElecCal, RPip]
  iv_subthreshold:  [IV, HyperDePol, DeHyperPol]
  ap_waveform:      [APWaveform]
  rest_firing:      [IDRest, FirePattern]
  threshold_search: [IDThres, IDThreshold, IDthresh]

thresholds_file: /Users/cristina.gonzalez/Documents/Pilot-Tests/datasets/Henrys/nwb-trace-qc/configs/default_thresholds.yaml
n_workers: 6

cell_table:
  path: /Users/cristina.gonzalez/Documents/Pilot-Tests/datasets/Henrys/JY/cell_ephys_comparison.csv
  cell_id_column: cell_id
  dataset_columns: [in_vpl, in_rn, in_obi]
