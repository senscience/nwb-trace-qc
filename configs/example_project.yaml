# nwb-trace-qc — example project config (commented template)
# Copy this, point at your data, and run `nwb-qc run --config <your-copy>.yaml`.

project_name: "My Cohort QC"

# All relative paths below are resolved against the directory containing THIS yaml file.
output_dir: ./qc_output

# 1. WHERE THE NWB FILES LIVE. One or more "sources"; each is a logical dataset label.
#    Two modes per source (mutually exclusive):
#      (a) directory tree: `path:` + `glob:` — walk a folder for NWBs.
#      (b) source manifest: `manifest:` — read a wrangler `source_manifest.json`
#          and QC the files at their `original_location`. No copy needed.
nwb_sources:
  - dataset: cohort_a
    path: /data/cohort_a
    recursive: true
    glob: "**/*.nwb"        # default; override for nested archive layouts

  # Example with nested archive layout (multiple subfolders containing data/<idx>/*.nwb)
  - dataset: cohort_b
    path: /data/cohort_b
    glob: "electrical-cell-recording (*)/data/*/*.nwb"

  # Example with a wrangler source manifest: discovers NWBs from the manifest's
  # `original_location` (no need for the wrangler to copy source files into the package).
  # `init-config` auto-detects this layout under any top-level subfolder.
  - dataset: cohort_c
    manifest: /data/output_…/proj/source_material/source_manifest.json
    only_processed: true    # default: skip entries where was_processed=false
    reuse_sha256: true      # default: trust the manifest's sha256 if size+mtime match (perf win)

# 2. (Optional) Pre-computed acquisition parquets the pipeline REUSES instead of opening
#    every NWB to count stimuli. If your data wrangler already produced these, point here.
acquisition_tables:
  - path: /data/output_cohort_a/parquet/acquisitions.parquet
    nwb_key_column: nwb_file           # column linking each acquisition row to an NWB file
    nwb_key_format: stem               # one of: stem | basename | absolute
    columns:
      stimulus_type: stimulus_type
      rate_hz: rate_hz
      n_samples: n_samples
      clamp_mode: clamp_mode
      sweep_number: sweep_number

# 3. Stimulus-protocol family mapping. The pipeline reasons in families; your lab can use
#    whatever protocol names you want. Edit if needed.
stimulus_protocols:
  spontaneous_hold: [SponHold3, SponHold30, SponNoHold30, StartHold]
  test_pulse:       [Rac, TestAmpl, TestRheo]
  iv_subthreshold:  [IV]
  ap_waveform:      [APWaveform]
  rest_firing:      [IDRest]
  threshold_search: [IDThres, IDThreshold]

# 4. Thresholds — usually a separate YAML so you can edit without touching project config.
thresholds_file: ./my_thresholds.yaml

# 5. Execution.
n_workers: 6

# 6. (Optional) Cell-id table for richer dataset attribution (e.g. one CSV that knows
#    which dataset each cell belongs to).
cell_table:
  path: /data/my_cells.csv
  cell_id_column: cell_id
  dataset_columns: [in_cohort_a, in_cohort_b]

# 7. (Optional) LLM vision-judge — off by default. When enabled, only `flag`-verdict cells
#    are sent to a vision model for a second opinion. Cells that already clearly pass or
#    fail by the numeric rules are not escalated. Vision can only escalate flag→fail; it
#    cannot downgrade a fail or auto-pass a flag.
vision_judge:
  enabled: false
  provider: anthropic              # 'anthropic' | 'openai' | 'mock'
  model: claude-haiku-4-5          # cheapest tier; opt up to sonnet/opus per project
  api_key_env: ANTHROPIC_API_KEY
  max_borderline_cells: 100        # hard cap on cell count sent to the model
  max_cost_usd: 1.0                # soft cap on per-run spend (USD). Pipeline stops
                                   # calling the model when running cost reaches this
                                   # value and finishes rendering with what it already
                                   # collected. Override per-run with `--max-cost-usd`.
  prompt_template: null            # null = bundled default; or a path to your own
  cache_responses: true
