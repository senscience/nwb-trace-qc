# Default pass / flag / fail thresholds for trace-level QC metrics.
# Copy + edit per project; reference your copy from your project YAML's `thresholds_file`.
#
# Rule keys:
#   fail_above / fail_below : numeric thresholds
#   flag_above / flag_below : numeric thresholds
#   fail_if_false / fail_if_true / flag_if_false / flag_if_true : boolean rules
# Precedence: any fail wins; else any flag; else pass. NaN values flag.

vrest_mv:
  # Too depolarised → unhealthy. Pyramidal-cell defaults; thalamic relay neurons run ~-65.
  fail_above: -45
  flag_above: -55

vrest_drift_mv:
  flag_above: 5

rs_mohm_final:
  fail_above: 30
  flag_above: 25

rs_drift_pct:
  fail_above: 30
  flag_above: 20

rin_mohm:
  # Cortical pyramidal: 50-150 MOhm typical. Very-low Rin → degraded cell (seal leak or
  # damaged membrane); very-high Rin → cell-type mismatch or small soma.
  fail_below: 20
  flag_below: 40
  flag_above: 500

rin_r2:
  flag_below: 0.85   # poor linear fit → suspect Rin value

ap_amp_overshoot_mv:
  fail_below: 0          # no overshoot at all → fail
  flag_below: 10         # weak overshoot → flag

ap_threshold_drift_mv:
  flag_above: 5

baseline_rms_mv:
  flag_above: 1.5

n_sweeps_clipped:
  fail_above: 0

n_sweeps_nan:
  fail_above: 0

# Bad-ending detection — any trim is a flag for the triager
n_sweeps_trimmed:
  flag_above: 0

qc_protocol_coverage:
  fail_if_false: true

# ────────────────────────────────────────────────────────────
# Visual-defect metrics (v0.2.0)
# These catch patterns the scalar metrics above miss:
#   - rac_decay_residual_rel    : glitchy / ringing test-pulse recovery
#   - vm_drift_within_sweep     : drifting seal (within-sweep Vm slope, mV/s)
#   - ap_failure_fraction       : initiated spikes that don't reach overshoot
#   - ap_amp_cv                 : inconsistent AP amplitudes in a train
#   - late_instability_index    : orderly firing degrading to oscillation late in a long sweep
# ────────────────────────────────────────────────────────────

rac_decay_residual_rel:
  flag_above: 0.15
  fail_above: 0.30

vm_drift_within_sweep_mv_per_s:
  flag_above: 2.0
  fail_above: 5.0

ap_failure_fraction:
  flag_above: 0.10
  fail_above: 0.25

ap_amp_cv:
  flag_above: 0.20
  fail_above: 0.40

late_instability_index:
  flag_above: 1.0
  fail_above: 3.0

# ────────────────────────────────────────────────────────────
# Whole-cell QC additions (v0.3.0)
# Require paired CurrentClampStimulusSeries (Ihld, Rin, accurate Rs).
# Session-drift metrics complement first/last drift with median-of-halves
# (more robust to single-sweep outliers). Edge-overshoot catches the
# capacitive-ringing pattern from experimenter sketches.
# ────────────────────────────────────────────────────────────

holding_current_pa:
  fail_above: 200       # |Ihld| > 200 pA — major seal leak
  flag_above: 100
  fail_below: -200
  flag_below: -100

holding_current_drift_pa:
  flag_above: 50
  fail_above: 100

vrest_session_drift_mv:
  flag_above: 5         # >5 mV depolarisation between halves
  fail_above: 10
  flag_below: -10       # also flag large hyperpolarisation drift (less common)

rs_session_drift_pct:
  flag_above: 25
  fail_above: 50

ap_overshoot_session_drift_mv:
  flag_below: -10       # overshoot drops > 10 mV across the session
  fail_below: -20

# test_pulse_edge_overshoot_mv: no auto rule by default (informational only).
# Per LNMC experimenter guidance, the edge transient's MAGNITUDE is ambiguous —
# a sharp transient is the good signature of active Rs compensation; a smooth
# exponential is the bad signature (no compensation). Use rac_variability_pct
# below for the cohort-stability check.

ap_amp_overshoot_min_mv:
  # Per-sweep worst-case overshoot — flags the sketched "BAD too small" Fire Pattern
  # even when the median is fine.
  flag_below: 10
  fail_below: 0

ap_amp_attenuation_frac:
  # Fraction of individual APs whose overshoot < 15 mV.
  flag_above: 0.10
  fail_above: 0.30

# ────────────────────────────────────────────────────────────
# v0.5.0 — LNMC experimenter-guidance additions
# Rules reflect "Parameters to consider while evaluating quality of whole cell,
# current clamp recordings" (eCode protocol guidance):
#   - Rs compensation should be set during recording; check the metadata value
#   - Rac variability across reps is the real Rs stability indicator
#   - AP_amplitude (peak − threshold) is the canonical AP-amplitude definition
#   - held_vm: monitored as separate from true Vrest
# ────────────────────────────────────────────────────────────

rs_compensation_pct:
  # Flag when no compensation was applied (or no value was recorded);
  # fail when negative or zero compensation slips through.
  flag_below: 50
  fail_below: 0

rac_variability_pct:
  # CV (std/median × 100) across per-Rac Rs estimates. > 20% suggests drift /
  # instability; > 40% means the recording is unreliable on this metric.
  flag_above: 20
  fail_above: 40

ap_amplitude_mv:
  # Peak − threshold. Healthy pyramidal: 60–100 mV; < 40 mV is failing.
  flag_below: 60
  fail_below: 40

held_vm_mv:
  # The held membrane potential should match the lab's target (~-70 mV).
  # Conservative flags catch drift away from the held setpoint.
  flag_above: -55
  flag_below: -85
