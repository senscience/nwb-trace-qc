[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nwb-trace-qc"
dynamic = ["version"]
description = "Cohort-scale, configurable QC for patch-clamp electrophysiology traces stored in NWB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cristina Gonzalez" }]
dependencies = [
    "pynwb>=2.5",
    "hdmf-zarr>=0.10",         # Zarr storage backend for NWB (alternative to HDF5)
    "efel>=5",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "click>=8",
    "pydantic>=2",
    "matplotlib",
    # Vision-judge providers installed by default so vision_judge.enabled: true
    # works out of the box once you set the corresponding API-key env var.
    "anthropic>=0.34",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nwb-qc = "nwb_trace_qc.cli:main"

[tool.setuptools.dynamic]
# Single source of truth — `__version__` in src/nwb_trace_qc/__init__.py. Bump
# that file once when releasing; this `version` reads it back. Prevents the
# pyproject.toml / __init__.py drift we hit with 0.3 → 0.6 (pip kept reporting
# the package as 0.2.0 because pyproject.toml's static version was never bumped).
version = { attr = "nwb_trace_qc.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nwb_trace_qc = ["templates/*.html"]
