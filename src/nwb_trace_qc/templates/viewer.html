<!doctype html>
<html><head><meta charset="utf-8"/>
<title>{{PROJECT}} — interactive trace viewer</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; color: #222; background: #fafbfc; }
  header { background: #1b2228; color: #fff; padding: .5rem 1rem; display: flex; align-items: center; gap: 1rem; }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  header .meta { color: #aaa; font-size: .8rem; }
  header .count { color: #ffe18a; font-size: .8rem; margin-left: auto; }
  main { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 42px); }
  #left { background: #fff; border-right: 1px solid #e0e0e0; overflow-y: auto; }
  #left .filter { padding: .5rem; border-bottom: 1px solid #eee; position: sticky; top: 0; background: #fff; z-index: 2; }
  #left input { width: 100%; padding: .3rem .4rem; border: 1px solid #ccc; border-radius: 3px; box-sizing: border-box; }
  #left ul { list-style: none; margin: 0; padding: 0; }
  #left li { padding: .4rem .6rem; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: .85rem; }
  #left li:hover { background: #f4f6f8; }
  #left li.active { background: #e6f0ff; }
  #left .verdict { display: inline-block; padding: 1px 5px; border-radius: 2px; font-size: .68rem; margin-right: .3rem; vertical-align: middle; }
  .v-pass { background: #d4edda; color: #155724; }
  .v-flag { background: #fff3cd; color: #856404; }
  .v-fail { background: #f8d7da; color: #721c24; }
  #right { display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
  #cell-header { padding: .5rem 1rem; background: #fff; border-bottom: 1px solid #eee; font-size: .9rem; }
  #cell-header .cell-id { font-weight: 600; font-size: 1rem; }
  #cell-header .triggered { color: #666; font-size: .8rem; margin-top: .25rem; }
  #cell-header .triggered .chip { display: inline-block; padding: 1px 6px; margin: 0 .15rem .15rem 0; border-radius: 2px; font-size: .72rem; }
  #cell-header .triggered .chip-fail { background: #f8d7da; color: #721c24; font-weight: 600; }
  #cell-header .triggered .chip-flag { background: #fff3cd; color: #856404; font-weight: 600; }
  #cell-header .triggered .chip-advisory { opacity: 0.55; font-weight: normal; }
  #cell-header .triggered details.advisory-fold { display: inline-block; }
  #cell-header .triggered details.advisory-fold > summary { list-style: none; cursor: pointer; font-size: .68rem; color: #666; padding: 1px 5px; background: #f0f0f0; border-radius: 2px; border: 1px dashed #ccc; }
  #cell-header .triggered details.advisory-fold > summary::-webkit-details-marker { display: none; }
  #cell-header .implicated { color: #444; font-size: .8rem; margin-top: .2rem; }
  #cell-header .fam-chip { display: inline-block; background: #fff3cd; color: #856404; padding: 1px 6px; border-radius: 2px; margin-right: .25rem; font-size: .72rem; font-weight: 600; }
  /* Trim banner: prominent, top of the right pane, impossible to miss when present */
  #trim-strip { background: #fff3cd; color: #856404; padding: .75rem 1rem; border-bottom: 2px solid #e0b54a; border-left: 6px solid #c89225; font-size: .92rem; line-height: 1.5; }
  #trim-strip .icon { font-size: 1.3rem; margin-right: .35rem; vertical-align: -0.1rem; }
  #trim-strip .where { font-weight: 700; }
  #content { display: grid; grid-template-columns: 280px 1fr; min-height: 0; overflow: hidden; }
  /* Sweep grid (left): tiles with lazy-loaded thumbnails */
  #sweep-list { background: #fff; border-right: 1px solid #eee; overflow-y: auto; font-size: .75rem; padding: 0; }
  #sweep-list .sweep-toolbar { position: sticky; top: 0; background: #fff; padding: .4rem .5rem; border-bottom: 1px solid #eee; z-index: 2; display: flex; align-items: center; gap: .4rem; }
  #sweep-list .sweep-toolbar button { font-size: .7rem; padding: .15rem .4rem; border: 1px solid #ccc; background: #fff; border-radius: 3px; cursor: pointer; }
  #sweep-list .sweep-toolbar button.active { background: #e6f0ff; border-color: #5a9ad6; color: #1c4f8b; font-weight: 600; }
  #sweep-list .family { padding: .25rem .5rem; background: #f4f6f8; font-weight: 600; font-size: .72rem; color: #666; position: sticky; top: 34px; z-index: 1; }
  #sweep-list .family.implicated { background: #fff8db; color: #856404; }
  #sweep-list .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem; padding: .25rem; }
  .tile { position: relative; cursor: pointer; border: 1px solid #ddd; border-radius: 3px; background: #fff; padding: 2px; min-height: 70px; transition: border-color .1s, opacity .15s; }
  .tile.implicated { border-color: #d6a76e; box-shadow: 0 0 0 1px #fff3cd inset; }
  .tile.dimmed { opacity: 0.45; }
  .tile.hidden { display: none; }
  .tile:hover { border-color: #5a9ad6; }
  .tile.selected { border-color: #1c4f8b; box-shadow: 0 0 0 2px #e6f0ff; }
  .tile img { display: block; width: 100%; height: 60px; object-fit: fill; background: #fafbfc; }
  .tile .lbl { font-size: .65rem; color: #444; margin-top: 2px; padding: 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .badge { position: absolute; top: 1px; right: 2px; font-size: .65rem; color: #856404; }
  /* Plot grid (right) */
  #plots {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: minmax(180px, 240px);
    gap: .5rem;
    padding: .5rem;
    background: #fafbfc;
    overflow: auto;
    align-content: start;
  }
  .panel {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 4px; padding: .4rem;
    position: relative; height: 240px; max-height: 240px; box-sizing: border-box; overflow: hidden;
  }
  .panel.empty { border-style: dashed; color: #999; display: flex; align-items: center; justify-content: center; font-style: italic; }
  .panel.loading { color: #888; display: flex; align-items: center; justify-content: center; font-style: italic; }
  .panel .title { font-size: .75rem; font-weight: 600; margin-bottom: .25rem; color: #444; }
  .panel .close { position: absolute; top: 4px; right: 6px; color: #999; cursor: pointer; font-size: .8rem; }
  .panel .close:hover { color: #c00; }
  .panel canvas { width: 100%; height: calc(100% - 20px); display: block; }
  .empty-state { padding: 2rem; color: #666; text-align: center; }
</style>
</head><body>
<header>
  <h1>{{PROJECT}} — interactive trace viewer</h1>
  <span class="meta">non-pass cells (fail + flag) — click a cell, then any sweep tile</span>
  <span class="count" id="flag-count">{{N_FLAG}} non-pass of {{N_TOTAL}} total</span>
</header>
<main>
  <aside id="left">
    <div class="filter">
      <input id="cell-filter" placeholder="search cell_id…" />
    </div>
    <ul id="cell-list"><li>loading…</li></ul>
  </aside>
  <section id="right">
    <div id="trim-strip" style="display:none"></div>
    <div id="cell-header"><span class="cell-id">select a cell on the left</span></div>
    <div id="content">
      <aside id="sweep-list"></aside>
      <div id="plots">
        <div class="panel empty">slot 1</div>
        <div class="panel empty">slot 2</div>
        <div class="panel empty">slot 3</div>
        <div class="panel empty">slot 4</div>
      </div>
    </div>
  </section>
</main>
<script>
const MAX_POINTS = 1500;
const SKIP_KEYS = new Set([
  'cell_id','dataset','nwb_path','nwb_sha256',
  'computed_verdict','final_verdict','triggered_metrics',
  'override_note','override_reviewer','override_date',
  'computed_verdict_with_vision','vision_reason',
  'vision_verdict','vision_confidence','vision_notes',
]);
let CELLS = [];
let activeCell = null;
let sweepsCache = {};
let METRIC_TO_FAMILY = {};
let showImplicatedOnly = true;     // user-requested default
const slots = [null, null, null, null];
let thumbObserver = null;          // IntersectionObserver for lazy thumb loading

async function loadFamilies() {
  try {
    const r = await fetch('/api/families');
    if (!r.ok) return;
    const body = await r.json();
    METRIC_TO_FAMILY = body.metric_to_family || {};
  } catch (e) { /* viewer still works without it; just no filtering */ }
}

function implicatedFamiliesFor(row) {
  if (!row || !row.triggered_metrics) return new Set();
  const out = new Set();
  for (const t of row.triggered_metrics) {
    const m = (t && t.metric) || null;
    const fam = m && METRIC_TO_FAMILY[m];
    if (fam) out.add(fam);
  }
  return out;
}

async function loadCells() {
  try {
    const r = await fetch('/api/cells');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const body = await r.json();
    CELLS = body.cells || [];
    // Header: prefer the new split when present, fall back to legacy n_flag
    // (which now actually means non-pass).
    const nFail = body.n_fail_only;
    const nFlag = body.n_flag_only;
    const nAttention = body.n_attention ?? body.n_flag;
    if (typeof nFail === 'number' && typeof nFlag === 'number') {
      document.getElementById('flag-count').textContent =
        `${nFail} fail · ${nFlag} flag of ${body.n_total} total`;
    } else {
      document.getElementById('flag-count').textContent =
        `${nAttention} non-pass of ${body.n_total} total`;
    }
  } catch (e) {
    document.getElementById('cell-list').innerHTML = `<li class="empty-state">error loading cells: ${e}</li>`;
    return;
  }
  renderCellList();
  // Deep link: ?cell=<id>
  const qs = new URLSearchParams(window.location.search);
  const wanted = qs.get('cell');
  if (wanted) selectCell(wanted);
}

function renderCellList() {
  const q = document.getElementById('cell-filter').value.toLowerCase();
  const ul = document.getElementById('cell-list');
  ul.innerHTML = '';
  const filtered = CELLS.filter(c => !q || (c.cell_id||'').toLowerCase().includes(q));
  // Server returns flag-first (borderline → human triage), then fail
  // (clearly-bad → mostly exclude). JS-side sort preserves that order.
  const rank = {flag: 0, fail: 1, pass: 2};
  filtered.sort((a, b) => {
    const ra = rank[a.final_verdict] ?? 3;
    const rb = rank[b.final_verdict] ?? 3;
    return ra - rb || (a.cell_id||'').localeCompare(b.cell_id||'');
  });
  filtered.slice(0, 500).forEach(c => {
    const li = document.createElement('li');
    li.dataset.cellid = c.cell_id;
    if (activeCell === c.cell_id) li.classList.add('active');
    li.innerHTML = `<span class="verdict v-${c.final_verdict}">${(c.final_verdict||'').toUpperCase()}</span>${c.cell_id} <span style="color:#999;font-size:.72rem">(${c.dataset||''})</span>`;
    li.onclick = () => selectCell(c.cell_id);
    ul.appendChild(li);
  });
  if (filtered.length > 500) {
    const li = document.createElement('li');
    li.style.color = '#999'; li.style.fontStyle = 'italic';
    li.textContent = `…and ${filtered.length - 500} more (refine search)`;
    ul.appendChild(li);
  }
  if (!filtered.length) {
    ul.innerHTML = '<li class="empty-state">no non-pass cells</li>';
  }
}

async function selectCell(cellId) {
  activeCell = cellId;
  document.querySelectorAll('#cell-list li').forEach(li => li.classList.toggle('active', li.dataset.cellid === cellId));
  const row = CELLS.find(c => c.cell_id === cellId) || {};
  const implicated = implicatedFamiliesFor(row);
  const verdict = row.final_verdict || '';
  // Tiered triggered chips: critical inline (eye-catching), advisory tucked
  // behind a "+N advisory" toggle (matches the v0.6.0 report layout).
  const items = Array.isArray(row.triggered_metrics) ? row.triggered_metrics : [];
  const renderChip = (t, advisory) => {
    const v = t.verdict || 'flag';
    const fam = t.metric ? METRIC_TO_FAMILY[t.metric] : null;
    const famTag = fam ? ` · ${fam}` : '';
    const cls = `chip chip-${v}` + (advisory ? ' chip-advisory' : '');
    return `<span class="${cls}">${t.metric} (${t.reason || t.verdict})${famTag}</span>`;
  };
  const critItems = items.filter(t => t.critical !== false);   // default critical
  const advItems  = items.filter(t => t.critical === false);
  const critHtml = critItems.map(t => renderChip(t, false)).join('');
  const advHtml  = advItems.map(t => renderChip(t, true)).join('');
  const triggeredBlock = items.length
    ? (
        critHtml +
        (advItems.length
          ? ` <details class='advisory-fold'><summary>+${advItems.length} advisory</summary>${advHtml}</details>`
          : '')
      )
    : '<span style="color:#999">no rule triggers</span>';

  const famChips = [...implicated].sort().map(f => `<span class="fam-chip">${f}</span>`).join('');
  const implLine = implicated.size
    ? `<div class="implicated"><b>Inspect these families:</b> ${famChips}</div>`
    : '';
  document.querySelector('#cell-header').innerHTML =
    `<span class="cell-id">${cellId}</span> <span style="color:#999;font-size:.8rem">· ${row.dataset||''} · <span class="verdict v-${verdict}">${verdict.toUpperCase()}</span></span>` +
    `<div class="triggered">${triggeredBlock}</div>` +
    implLine;

  // Recording-trim BANNER (prominent — sits above the cell header). Surfaces
  // when bad-ending detection trimmed the tail so the user knows the metrics
  // reflect the pre-degradation window.
  const trimEl = document.getElementById('trim-strip');
  const nTrim = Number(row.n_sweeps_trimmed || 0);
  const cutoff = row.bad_ending_at_sweep;
  const total = row.n_sweeps_total;
  if (nTrim > 0) {
    const reason = row.bad_ending_reason ? ` <i>(${row.bad_ending_reason})</i>` : '';
    const where = (cutoff !== undefined && cutoff !== null && !Number.isNaN(cutoff))
      ? ` <span class="where">at sweep ${cutoff}${total ? '/' + total : ''}</span>`
      : '';
    trimEl.innerHTML =
      `<span class="icon">⚠</span><b>Recording trimmed${where}</b>${reason}. ` +
      `${nTrim} tail sweep${nTrim === 1 ? '' : 's'} excluded from the metric scalars — ` +
      `the verdicts above reflect the pre-degradation period only.`;
    trimEl.style.display = '';
  } else {
    trimEl.innerHTML = '';
    trimEl.style.display = 'none';
  }
  for (let i = 0; i < 4; i++) showLoading(i);

  if (!sweepsCache[cellId]) {
    const r = await fetch(`/api/sweeps/${encodeURIComponent(cellId)}`);
    if (!r.ok) {
      document.getElementById('sweep-list').innerHTML = `<div class="empty-state">error: ${r.status}</div>`;
      for (let i = 0; i < 4; i++) clearSlot(i);
      return;
    }
    sweepsCache[cellId] = await r.json();
  }
  renderSweepGrid(implicated);
  const sweeps = sweepsCache[cellId];
  // Auto-pick first sweep of up to 4 distinct *implicated* families if available,
  // else fall back to any 4 distinct families.
  const seen = new Set();
  const picks = [];
  for (const s of sweeps) {
    const inImpl = !implicated.size || implicated.has(s.family);
    if (inImpl && s.family && !seen.has(s.family) && picks.length < 4) {
      picks.push(s); seen.add(s.family);
    }
  }
  if (!picks.length) {
    for (const s of sweeps) {
      if (s.family && !seen.has(s.family) && picks.length < 4) {
        picks.push(s); seen.add(s.family);
      }
    }
  }
  const tasks = [];
  for (let i = 0; i < 4; i++) {
    if (picks[i]) tasks.push(loadSweepIntoSlot(picks[i], i));
    else clearSlot(i);
  }
  await Promise.all(tasks);
}

function renderSweepGrid(implicated) {
  const sw = document.getElementById('sweep-list');
  sw.innerHTML = '';
  // Toolbar with implicated-only / all toggle
  const toolbar = document.createElement('div');
  toolbar.className = 'sweep-toolbar';
  toolbar.innerHTML = `
    <span style="font-size:.72rem;color:#666;">Show:</span>
    <button data-mode="implicated" ${showImplicatedOnly ? 'class="active"' : ''}>implicated only</button>
    <button data-mode="all" ${!showImplicatedOnly ? 'class="active"' : ''}>all sweeps</button>
  `;
  toolbar.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      showImplicatedOnly = btn.dataset.mode === 'implicated';
      renderSweepGrid(implicated);
    };
  });
  sw.appendChild(toolbar);

  const byFamily = {};
  for (const s of sweepsCache[activeCell] || []) {
    const f = s.family || 'other';
    (byFamily[f] = byFamily[f] || []).push(s);
  }
  // Family ordering: implicated first, then alpha
  const fams = Object.keys(byFamily).sort((a, b) => {
    const ai = implicated.has(a) ? 0 : 1, bi = implicated.has(b) ? 0 : 1;
    return ai !== bi ? ai - bi : a.localeCompare(b);
  });
  let anyShown = false;
  for (const fam of fams) {
    const fSweeps = byFamily[fam];
    const isImplicated = implicated.size === 0 || implicated.has(fam);
    if (showImplicatedOnly && !isImplicated) continue;
    anyShown = true;
    const h = document.createElement('div');
    h.className = 'family' + (implicated.has(fam) ? ' implicated' : '');
    h.textContent = `${fam} (${fSweeps.length})`;
    sw.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'grid';
    fSweeps.forEach(s => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      if (implicated.has(s.family)) tile.classList.add('implicated');
      if (implicated.size && !implicated.has(s.family)) tile.classList.add('dimmed');
      tile.dataset.idx = s.idx;
      tile.dataset.family = s.family || '';
      tile.innerHTML = `
        <img data-src="/api/thumb/${encodeURIComponent(activeCell)}/${s.idx}?w=220&h=70" alt="${s.stimulus_type} ${s.sweep_number}" loading="lazy"/>
        <div class="lbl">${s.stimulus_type} ${s.sweep_number}<span style="color:#999"> · ${s.duration_s.toFixed(2)}s</span></div>
        ${implicated.has(s.family) ? '<span class="badge">⚠</span>' : ''}
      `;
      tile.onclick = () => {
        const slot = slots.findIndex(x => x === null);
        loadSweepIntoSlot(s, slot >= 0 ? slot : 0);
      };
      grid.appendChild(tile);
    });
    sw.appendChild(grid);
  }
  if (!anyShown) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = (implicated.size === 0)
      ? `no sweeps in this NWB`
      : `no sweeps in the implicated families<br/><br/><b>⚠ Your <code>stimulus_protocols:</code> mapping may not cover this lab's protocol names.</b><br/>See the YAML's UNMAPPED block. Or click <a href="#" onclick="event.preventDefault();showImplicatedOnly=false;renderSweepGrid(new Set());">[show all sweeps]</a>.`;
    sw.appendChild(empty);
  }
  attachLazyThumbObserver();
  highlightSelectedSweeps();
}

function attachLazyThumbObserver() {
  if (thumbObserver) thumbObserver.disconnect();
  thumbObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const img = entry.target;
      if (img.dataset.src && !img.src) {
        img.src = img.dataset.src;
      }
      thumbObserver.unobserve(img);
    }
  }, { root: document.getElementById('sweep-list'), rootMargin: '120px', threshold: 0.01 });
  document.querySelectorAll('#sweep-list .tile img').forEach(img => thumbObserver.observe(img));
}

function highlightSelectedSweeps() {
  document.querySelectorAll('#sweep-list .tile').forEach(el => {
    const idx = parseInt(el.dataset.idx, 10);
    el.classList.toggle('selected', slots.some(s => s && s.sweep_idx === idx));
  });
}

function showLoading(slotIdx) {
  const panel = document.querySelectorAll('#plots .panel')[slotIdx];
  panel.className = 'panel loading';
  panel.innerHTML = `Loading sweep…`;
}

async function loadSweepIntoSlot(sweep, slotIdx) {
  showLoading(slotIdx);
  try {
    const r = await fetch(`/api/trace/${encodeURIComponent(activeCell)}/${sweep.idx}?max_points=${MAX_POINTS}`);
    if (!r.ok) { clearSlot(slotIdx); return; }
    const data = await r.json();
    slots[slotIdx] = { cell_id: activeCell, sweep_idx: sweep.idx, name: sweep.name, family: sweep.family };
    highlightSelectedSweeps();
    drawPanel(slotIdx, data, sweep);
  } catch (e) {
    const panel = document.querySelectorAll('#plots .panel')[slotIdx];
    panel.className = 'panel empty';
    panel.innerHTML = `error: ${e}`;
  }
}

function clearSlot(slotIdx) {
  slots[slotIdx] = null;
  const panel = document.querySelectorAll('#plots .panel')[slotIdx];
  panel.innerHTML = `slot ${slotIdx+1}`; panel.className = 'panel empty';
  highlightSelectedSweeps();
}

function drawPanel(slotIdx, data, sweep) {
  const panel = document.querySelectorAll('#plots .panel')[slotIdx];
  panel.className = 'panel';
  panel.innerHTML = `<div class="title">${sweep.family ? '['+sweep.family+'] ' : ''}${data.name}</div><span class="close" title="clear">×</span><canvas></canvas>`;
  panel.querySelector('.close').onclick = () => clearSlot(slotIdx);
  const canvas = panel.querySelector('canvas');
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const xs = data.x_seconds, ys = data.y_mv;
  if (!xs.length) return;
  const xMin = xs[0], xMax = xs[xs.length-1];
  let yMin = Infinity, yMax = -Infinity;
  for (const v of ys) { if (v<yMin) yMin=v; if (v>yMax) yMax=v; }
  const pad = (yMax-yMin) * 0.08 || 1;
  yMin -= pad; yMax += pad;
  const margin = {l: 35, r: 8, t: 4, b: 18};
  const innerW = w - margin.l - margin.r, innerH = h - margin.t - margin.b;
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(margin.l, margin.t); ctx.lineTo(margin.l, margin.t + innerH);
  ctx.lineTo(margin.l + innerW, margin.t + innerH); ctx.stroke();
  if (yMin < 0 && yMax > 0) {
    const y0 = margin.t + innerH * (1 - (0 - yMin) / (yMax - yMin));
    ctx.strokeStyle = '#cce'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(margin.l, y0); ctx.lineTo(margin.l + innerW, y0); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.strokeStyle = '#222'; ctx.lineWidth = 0.8;
  ctx.beginPath();
  for (let i = 0; i < xs.length; i++) {
    const x = margin.l + innerW * (xs[i] - xMin) / (xMax - xMin || 1);
    const y = margin.t + innerH * (1 - (ys[i] - yMin) / (yMax - yMin || 1));
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.fillStyle = '#666'; ctx.font = '10px monospace';
  ctx.textAlign = 'right'; ctx.fillText(yMax.toFixed(0)+'mV', margin.l-3, margin.t+9);
  ctx.fillText(yMin.toFixed(0)+'mV', margin.l-3, margin.t+innerH);
  ctx.textAlign = 'center';
  ctx.fillText(xMin.toFixed(2)+'s', margin.l, margin.t+innerH+12);
  ctx.fillText(xMax.toFixed(2)+'s', margin.l+innerW, margin.t+innerH+12);
}

document.getElementById('cell-filter').addEventListener('input', renderCellList);
let _resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    slots.forEach((s, i) => {
      if (s) {
        fetch(`/api/trace/${encodeURIComponent(s.cell_id)}/${s.sweep_idx}?max_points=${MAX_POINTS}`)
          .then(r => r.json()).then(d => drawPanel(i, d, s));
      }
    });
  }, 200);
});

(async () => { await loadFamilies(); await loadCells(); })();
</script>
</body></html>
